name: Apply Michelle dark palette

on:
  push:
    paths:
      - ".github/workflows/apply-michelle-theme.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add theme stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          marker = '<link rel="stylesheet" href="theme-dark.css">'
          if marker not in s:
              s = s.replace("</head>", f"  {marker}\\n</head>", 1)
              p.write_text(s, encoding="utf-8")
          PY
      - name: Commit theme
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html theme-dark.css
          git diff --cached --quiet || git commit -m "Refine Michelle site dark saturated palette"
          git push
